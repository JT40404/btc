<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC · Behind The Curtain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#DCD6CB; --bg:#F1ECE2; --fg:#5A3200; --dim:#8E7658; --line:#CDBFA8;
  --ok:#1C7560; --bad:#B03A1E; --bar:#E3DBCC;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --crt:"VT323","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0A0703; --bg:#171006; --fg:#F4B860; --dim:#9A7440; --line:#3B2A15;
    --ok:#7FD6BC; --bad:#F07A5C; --bar:#211709;
  }
}
:root[data-theme="dark"]{
  --page:#0A0703; --bg:#171006; --fg:#F4B860; --dim:#9A7440; --line:#3B2A15;
  --ok:#7FD6BC; --bad:#F07A5C; --bar:#211709;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--fg);font-family:var(--mono);font-size:15px;line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.term{max-width:900px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:12px}
.win{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
.titlebar i{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
.titlebar .host{margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ca{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;max-width:60%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:13px;cursor:pointer;color:var(--fg)}
.ca:hover{border-color:var(--dim)}
.ca b{font-weight:700}
.ca code{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ca em{font-style:normal;color:var(--dim)}
.ca.done em{color:var(--ok)}
.ca.empty{cursor:default}
.ca.empty code{color:var(--dim)}
.screen{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 24px}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.55em}
.dim{color:var(--dim)}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.big{font-family:var(--crt);font-size:clamp(46px,11vw,96px);line-height:.95;margin:6px 0;letter-spacing:.02em}
.big.two{color:var(--ok)}

.prompt{display:flex;gap:10px;align-items:baseline}
.prompt[hidden]{display:none}
.prompt label{color:var(--dim);white-space:nowrap}
.prompt input{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:0;caret-color:var(--fg);color:var(--fg)}
.prompt input::placeholder{color:var(--dim);opacity:.6}

.range{margin:12px 0 14px;border:1px dashed var(--line);border-radius:6px;padding:10px}
.range[hidden]{display:none}
.hud{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;margin-bottom:8px}
.hud b{font-weight:500}
.keyline{font-family:var(--crt);font-size:26px;line-height:1.1;margin:0 0 8px;letter-spacing:.04em;overflow-x:auto;white-space:nowrap}
.keyline .got{color:var(--ok)}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:4px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;margin-top:10px}
.ctl{display:block;font-size:14px}
.ctl span{display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--fg);height:26px;margin:2px 0 0}
.fire{background:var(--fg);color:var(--bg);border:0;border-radius:4px;padding:9px 22px;font-weight:700;cursor:pointer}
.fire:disabled{opacity:.35;cursor:not-allowed}
.keys{font-size:13px;color:var(--dim);margin:8px 0 0}
@media (max-width:560px){
  body{font-size:14px}
  .titlebar .host{display:none}
  .ca{max-width:100%;margin-left:6px;flex:1}
  .term{padding:0}
  .win{border-radius:0;border-left:0;border-right:0}
  .screen{padding:12px 12px 20px}
  .controls{grid-template-columns:1fr 1fr}
  .fire{grid-column:1/-1;padding:12px}
  .keys{display:none}
}
</style>
</head>
<body>
<div class="term">
  <div class="win">
    <div class="titlebar"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><span class="host" aria-hidden="true">btc@behind-the-curtain: ~</span>
      <button class="ca" id="ca" type="button" title="Copy contract address"><b>CA</b><code id="caText"></code><em id="caHint">copy</em></button>
    </div>
    <div class="screen" id="screen">
      <div id="log" aria-live="polite"></div>
      <div class="prompt" id="prompt" hidden><label for="cmd" id="pLabel">$</label><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></div>
    </div>
  </div>
</div>

<template id="rangeTpl">
  <section class="range" aria-label="Key vault range">
    <p class="keyline" id="keyline" aria-label="Launch key progress"></p>
    <div class="hud">
      <span>wind <b id="windVal">0</b></span>
      <span>vaults cracked <b id="vaultVal">0/4</b></span>
      <span>shots <b id="shotVal">0</b></span>
    </div>
    <div class="stage"><canvas id="cv" width="960" height="540" aria-label="Firing range with four key vaults"></canvas></div>
    <div class="controls">
      <label class="ctl"><span>angle <b id="angV">45°</b></span><input type="range" id="ang" min="0" max="180" step="1" value="45"></label>
      <label class="ctl"><span>power <b id="powV">60</b></span><input type="range" id="pow" min="10" max="100" step="1" value="60"></label>
      <button class="fire" id="fire" disabled>Fire</button>
    </div>
    <p class="keys">Left and right arrows aim, up and down set power, space fires. Hold Shift for fine steps.</p>
  </section>
</template>

<script>
// ===== Paste your contract address between the quotes =====
const CONTRACT_ADDRESS = "BevrqhVXsWau7YaBJn7fPUNZwvEdCW2makpM74mEpump";
// ============================================================

const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));

const KEY_WORDS = ['LOL','JK','LAUNCHPADS','SUCK'];
const KEY_NORM = KEY_WORDS.join('');

/* ================= Terminal ================= */
const log = $('#log'), screen = $('#screen'), promptEl = $('#prompt'), cmd = $('#cmd');
const down = () => { screen.scrollTop = screen.scrollHeight; };

async function say(text, cls='', delay=110){
  const d = document.createElement('div');
  d.className = 'ln ' + cls; d.textContent = text;
  log.appendChild(d); down();
  await sleep(delay);
  return d;
}
async function dots(label, result, cls='', ms=420){
  const d = await say(label + ' ', '', 0);
  const steps = reduceMotion ? 0 : 6;
  for(let i=0;i<steps;i++){ d.textContent += '.'; down(); await sleep(ms/steps); }
  d.textContent += (steps ? ' ' : '... ') ;
  const s = document.createElement('span'); s.className = cls || 'ok'; s.textContent = result; d.appendChild(s);
  await sleep(80);
}
function ask(label, placeholder=''){
  return new Promise(res => {
    $('#pLabel').textContent = label;
    cmd.value = ''; cmd.placeholder = placeholder;
    promptEl.hidden = false; screen.appendChild(promptEl); down();
    cmd.focus({preventScroll:true});
    cmd.onkeydown = e => {
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const v = cmd.value.trim();
      promptEl.hidden = true;
      const d = document.createElement('div'); d.className = 'ln';
      const l = document.createElement('span'); l.className = 'dim'; l.textContent = label + ' ';
      d.appendChild(l); d.appendChild(document.createTextNode(v));
      log.appendChild(d); down();
      res(v);
    };
  });
}
screen.addEventListener('click', e => {
  if(!promptEl.hidden && !window.getSelection().toString() && !e.target.closest('.range')) cmd.focus({preventScroll:true});
});

/* ================= Flow ================= */
async function run(){
  log.innerHTML = '';
  await say('BTC launchpad 4.2.0', 'dim', 60);
  await say('BTC stands for Behind The Curtain. not that one.', 'dim', 200);
  await dots('drawing the curtain', 'ok');
  await dots('syncing bonding curves', 'ok');
  await dots('indexing 11,284 tokens launched today', 'ok');
  await dots('loading influencer allowlist', 'ok');
  await dots('hiding the dev wallet behind the curtain', 'ok');
  await dots('checking vibes', 'immaculate');
  await say('');
  await say('ready. step right up and launch a coin.', '', 200);
  await say('');

  let name = '';
  while(true){
    name = await ask('token name:', 'e.g. Dog With Hat 2');
    if(name.length >= 2 && name.length <= 32) break;
    await say('name needs 2 to 32 characters. try again.', 'bad');
  }
  let ticker = '';
  while(true){
    ticker = (await ask('ticker:', 'e.g. HAT2')).replace(/^\$/,'').toUpperCase();
    if(/^[A-Z0-9]{2,10}$/.test(ticker)) break;
    await say('ticker needs 2 to 10 letters or numbers. try again.', 'bad');
  }
  const clones = Math.floor(rnd(14,212));
  await dots(`checking if $${ticker} is taken`, `${clones} tokens already use it. proceeding anyway`, 'dim');
  await dots('minting 1,000,000,000 $' + ticker, 'queued');
  await say('');
  await say('launch blocked: no launch key found.', 'bad', 260);
  await say('the key is split across 4 vaults behind the curtain.');
  await say('crack all 4 to decrypt it. set angle and power, mind the wind.');
  await say('');

  const rangeNode = $('#rangeTpl').content.firstElementChild.cloneNode(true);
  log.appendChild(rangeNode);
  bindRange();
  await startRange();
  await sleep(500);

  await say('');
  await say('all 4 vaults cracked. launch key decrypted:', 'ok', 250);
  await say(KEY_WORDS.join('-'), 'ok', 350);
  await say('');

  while(true){
    const k = await ask(`enter launch key to deploy $${ticker}:`, 'type the key above');
    if(k.toUpperCase().replace(/[^A-Z]/g,'') === KEY_NORM) break;
    await say('invalid key. it’s the one printed above.', 'bad');
  }

  await say('');
  await dots('signing transaction', 'ok');
  await dots('seeding liquidity with 0.00 SOL', 'ok');
  await dots('allocating 97% of supply to dev wallet', 'ok');
  await dots('posting to 40 telegram groups', 'ok');
  await dots('pulling back the curtain', 'ok');
  await dots('deploying $' + ticker, 'wait', 'dim', 900);
  await sleep(500);
  await say('');
  const a = await say('LOL JK', 'big', 500);
  await say('LAUNCHPADS SUCK', 'big two', 600);
  await say('pay no attention to the man behind the curtain. there was never a coin back here.', 'dim');
  await say('');
  await say(`nothing was launched and nothing was charged. ${name} lives on in your heart.`, 'dim');
  await say('');
  while(true){
    const v = (await ask('$', 'type again to start over')).toLowerCase();
    if(v === 'again' || v === 'restart') return run();
    if(v === 'help') await say('commands: again');
    else if(v) await say(`${v}: command not found. there is only again.`, 'dim');
  }
}

/* ================= Range ================= */
const W=960, H=540, GRAV=380, WIND_K=7, SPEED=7.2, BARREL=20, RADIUS=34, CRACK=30, DT=1/120;
let cv, ctx, terrC, DPR = Math.min(2, window.devicePixelRatio||1);
let terrain = new Float32Array(W), player=null, vaults=[];
let phase='idle', wind=0, shot=null, boom=null, particles=[], floats=[], lastTrail=null;
let shake=0, shots=0, missStreak=0, onDone=null, rafOn=false, last=0;
let C = {};

function readColors(){
  const s = getComputedStyle(document.documentElement);
  ['bg','fg','dim','line','ok','bad'].forEach(k => C[k] = s.getPropertyValue('--'+k).trim());
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); if(terrC) paintTerrain(); });

function bindRange(){
  cv = $('#cv'); ctx = cv.getContext('2d');
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  terrC = document.createElement('canvas'); terrC.width = W*DPR; terrC.height = H*DPR;
  terrC.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  $('#ang').oninput = syncAim; $('#pow').oninput = syncAim;
  $('#fire').onclick = () => { if(phase==='aim'){ syncAim(); fire(); } };
}

function genTerrain(){
  const t = new Float32Array(W);
  const base = rnd(H*.64,H*.74);
  const waves = [[rnd(16,34),rnd(.004,.008),rnd(0,6.28)],[rnd(8,16),rnd(.012,.02),rnd(0,6.28)],[rnd(2,4),rnd(.04,.07),rnd(0,6.28)]];
  const hc = rnd(W*.36,W*.5), hh = rnd(120,210), hw = rnd(60,110);
  for(let x=0;x<W;x++){
    let y = base; for(const [a,f,p] of waves) y += a*Math.sin(x*f+p);
    y -= hh*Math.exp(-((x-hc)**2)/(2*hw*hw));
    t[x] = clamp(y, H*.2, H-40);
  }
  return t;
}
function flatten(cx,r){
  let s=0,n=0; for(let x=cx-r;x<=cx+r;x++){ s+=terrain[x]; n++; }
  const avg = s/n;
  for(let x=cx-r-12;x<=cx+r+12;x++){ if(x<0||x>=W) continue; const d=Math.abs(x-cx); const k=d<=r?1:1-(d-r)/12; terrain[x]=terrain[x]*(1-k)+avg*k; }
}
function groundY(x, half=12){ let m=H; for(let i=Math.max(0,Math.round(x)-half); i<=Math.min(W-1,Math.round(x)+half); i++) m=Math.min(m,terrain[i]); return m; }
function carve(cx,cy,r){
  for(let x=Math.max(0,Math.floor(cx-r)); x<=Math.min(W-1,Math.ceil(cx+r)); x++){
    const dx=x-cx, dy=Math.sqrt(Math.max(0,r*r-dx*dx));
    const top=terrain[x], cBot=cy+dy, cTop=cy-dy;
    if(top>=cBot) continue;
    terrain[x] = Math.min(H-6, top + (cBot-Math.max(top,cTop)));
  }
}

function paintTerrain(){
  const c = terrC.getContext('2d');
  c.clearRect(0,0,W,H);
  c.beginPath(); c.moveTo(0,H);
  for(let x=0;x<W;x++) c.lineTo(x, terrain[x]);
  c.lineTo(W,H); c.closePath();
  c.fillStyle = C.bg; c.fill();
  c.save(); c.clip();
  c.strokeStyle = C.line; c.lineWidth = 1;
  for(let y=Math.floor(H*.2); y<H; y+=7){ c.beginPath(); c.moveTo(0,y+.5); c.lineTo(W,y+.5); c.stroke(); }
  c.restore();
  c.strokeStyle = C.fg; c.lineWidth = 2; c.beginPath();
  for(let x=0;x<W;x++){ x ? c.lineTo(x,terrain[x]) : c.moveTo(0,terrain[0]); }
  c.stroke();
}

function launch(angle,power){
  const a=angle*Math.PI/180, bx=player.x, by=player.y-14;
  return { x:bx+Math.cos(a)*BARREL, y:by-Math.sin(a)*BARREL, vx:Math.cos(a)*power*SPEED, vy:-Math.sin(a)*power*SPEED, t:0, trail:[] };
}
function stepShot(s,dt){
  s.vx += wind*WIND_K*dt; s.vy += GRAV*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.t += dt;
  if(s.x<-30 || s.x>W+30 || s.y>H+10 || s.t>14) return {type:'out'};
  for(const v of vaults){
    if(v.hit) continue;
    const dx=s.x-v.x, dy=s.y-(v.y-10);
    if(dx*dx+dy*dy < 16*16) return {type:'vault', x:s.x, y:s.y};
  }
  if(s.t>.15){ const dx=s.x-player.x, dy=s.y-(player.y-7); if(dx*dx+dy*dy<15*15) return {type:'ground', x:s.x, y:s.y}; }
  const xi = s.x|0;
  if(xi>=0 && xi<W && s.y>=terrain[xi]) return {type:'ground', x:s.x, y:s.y};
  return null;
}

function startRange(){
  readColors();
  terrain = genTerrain();
  const px = Math.round(rnd(60,120));
  flatten(px,16);
  // four vaults spread across the map, one in each quarter past the launcher
  const slots = [[200,290],[430,560],[600,740],[790,910]];
  const order = [0,1,2,3];
  vaults = slots.map(([a,b],i) => { const x=Math.round(rnd(a,b)); flatten(x,10); return { x, y:0, hit:false, word:order[i], flash:0, fallFrom:null }; });
  paintTerrain();
  player = { x:px, y:groundY(px), angle:45, power:60 };
  vaults.forEach(v => v.y = groundY(v.x, 8));
  wind = Math.round(rnd(-3,3)*10)/10;
  shot=null; boom=null; particles=[]; floats=[]; lastTrail=null; shots=0; missStreak=0;
  $('#ang').value=45; $('#pow').value=60; syncAim();
  updateHud();
  phase='aim'; $('#fire').disabled=false;
  if(!rafOn){ rafOn=true; last=performance.now(); requestAnimationFrame(frame); }
  return new Promise(res => { onDone = res; });
}

function fire(){
  shot = launch(player.angle, player.power);
  phase = 'flight'; shots++;
  $('#fire').disabled = true;
  updateHud();
}

function crackNear(x,y){
  let cracked = [];
  for(const v of vaults){
    if(v.hit) continue;
    if(Math.hypot(v.x-x, (v.y-10)-y) < CRACK){ v.hit = true; v.flash = .6; cracked.push(v); }
  }
  return cracked;
}

function explode(r){
  boom = {x:r.x, y:r.y, t:0};
  const cracked = crackNear(r.x, r.y);
  carve(r.x, r.y, RADIUS); paintTerrain();
  for(let i=0;i<30;i++){ const a=rnd(0,Math.PI*2), v=rnd(60,240); particles.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,life:rnd(.4,1)}); }
  if(!reduceMotion) shake = 7;
  phase = 'boom';
  if(cracked.length){
    missStreak = 0;
    cracked.forEach(v => {
      floats.push({x:v.x, y:v.y-34, txt:KEY_WORDS[v.word], t:0});
      say(`vault ${vaults.indexOf(v)+1} cracked. shard recovered: ${KEY_WORDS[v.word]}`, 'ok', 0);
    });
    updateHud();
  } else {
    missStreak++;
    if(missStreak === 5) say('tip: your last shot’s path stays on screen. nudge from there.', 'dim', 0);
  }
}

function endTurn(){
  if(vaults.every(v=>v.hit)){
    phase = 'over'; $('#fire').disabled = true;
    const d = onDone; onDone = null; if(d) setTimeout(d, 600);
    return;
  }
  wind = clamp(Math.round((wind + rnd(-1.5,1.5))*10)/10, -6, 6);
  updateHud();
  phase = 'aim'; $('#fire').disabled = false;
}

function update(dt){
  if(phase==='flight' && shot){
    let acc=dt, r=null;
    while(acc>0 && !r){ r=stepShot(shot,DT); acc-=DT; if(!r && ((shot.t*120)|0)%2===0) shot.trail.push([shot.x,shot.y]); }
    if(r){
      lastTrail = shot.trail.slice(); shot = null;
      if(r.type==='out'){ missStreak++; if(missStreak===5) say('tip: your last shot’s path stays on screen. nudge from there.', 'dim', 0); phase='settle'; }
      else explode(r);
    }
  } else if(phase==='boom'){
    boom.t += dt; if(boom.t > .5){ boom=null; phase='settle'; }
  } else if(phase==='settle'){
    let moving = false;
    for(const o of [player, ...vaults]){
      const g = o===player ? groundY(o.x) : groundY(o.x, 8);
      if(o.y < g-.5){ o.y = Math.min(g, o.y + 240*dt); moving = true; } else o.y = g;
    }
    if(!moving && particles.length < 6) endTurn();
  }
  for(const p of particles){ p.vy+=GRAV*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; const xi=p.x|0; if(xi>=0&&xi<W&&p.y>terrain[xi]) p.life=0; }
  particles = particles.filter(p=>p.life>0);
  for(const f of floats) f.t += dt; floats = floats.filter(f=>f.t<1.6);
  for(const v of vaults) v.flash = Math.max(0, v.flash-dt);
  shake = Math.max(0, shake-dt*30);
}

function drawLauncher(){
  const t = player;
  ctx.save(); ctx.translate(t.x, t.y);
  const a = t.angle*Math.PI/180;
  ctx.strokeStyle = C.fg; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(Math.cos(a)*BARREL, -14-Math.sin(a)*BARREL); ctx.stroke();
  ctx.fillStyle = C.fg;
  ctx.beginPath(); ctx.arc(0,-12,8,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-15,-4); ctx.lineTo(15,-4); ctx.lineTo(11,-12); ctx.lineTo(-11,-12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.bg; ctx.fillRect(-16,-5,32,6);
  ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5; ctx.strokeRect(-16,-5,32,6);
  ctx.restore();
}

function drawVault(v, i){
  ctx.save(); ctx.translate(v.x, v.y);
  const col = v.hit ? C.ok : C.fg;
  const blink = v.flash>0 && ((v.flash*18)|0)%2;
  ctx.strokeStyle = col; ctx.fillStyle = blink ? col : C.bg; ctx.lineWidth = 2;
  ctx.fillRect(-12,-20,24,20); ctx.strokeRect(-12,-20,24,20);
  if(v.hit){
    // open lid
    ctx.beginPath(); ctx.moveTo(-12,-20); ctx.lineTo(-18,-32); ctx.lineTo(6,-34); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0,-10,3,0,Math.PI*2); ctx.fillStyle = col; ctx.fill();
    ctx.fillRect(-1,-10,2,6);
  }
  ctx.fillStyle = col; ctx.font = '500 13px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
  ctx.fillText(v.hit ? KEY_WORDS[v.word] : String(i+1), 0, v.hit ? -40 : -28);
  ctx.restore();
}

function render(){
  if(!ctx) return;
  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
  ctx.fillStyle = C.bg; ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle = C.line;
  for(let y=30;y<H;y+=40) for(let x=30;x<W;x+=40) ctx.fillRect(x,y,1.5,1.5);
  ctx.drawImage(terrC,0,0,W,H);
  if(lastTrail && phase==='aim'){
    ctx.fillStyle = C.dim;
    for(let i=0;i<lastTrail.length;i+=3){ ctx.beginPath(); ctx.arc(lastTrail[i][0],lastTrail[i][1],1.5,0,Math.PI*2); ctx.fill(); }
  }
  vaults.forEach(drawVault);
  if(player) drawLauncher();
  if(phase==='aim' && player){
    const a=player.angle*Math.PI/180, len=26+player.power*.5;
    ctx.strokeStyle=C.dim; ctx.setLineDash([4,5]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(player.x+Math.cos(a)*BARREL, player.y-14-Math.sin(a)*BARREL); ctx.lineTo(player.x+Math.cos(a)*(BARREL+len), player.y-14-Math.sin(a)*(BARREL+len)); ctx.stroke(); ctx.setLineDash([]);
  }
  if(shot){
    ctx.strokeStyle=C.dim; ctx.lineWidth=2; ctx.beginPath();
    shot.trail.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    ctx.fillStyle=C.fg;
    if(shot.y<0){ ctx.beginPath(); ctx.moveTo(shot.x,4); ctx.lineTo(shot.x-7,16); ctx.lineTo(shot.x+7,16); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(shot.x,shot.y,4,0,Math.PI*2); ctx.fill(); }
  }
  if(boom){
    const k=boom.t/.5, r=RADIUS*(.4+.8*Math.min(1,k*1.6));
    ctx.strokeStyle=C.fg; ctx.globalAlpha=1-k; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(boom.x,boom.y,r,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(boom.x,boom.y,r*.55,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=C.fg;
  for(const p of particles){ ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillRect(p.x-1.5,p.y-1.5,3,3); }
  ctx.globalAlpha=1;
  ctx.font='400 30px VT323, "IBM Plex Mono", monospace'; ctx.textAlign='center';
  for(const f of floats){ ctx.globalAlpha=1-f.t/1.6; ctx.fillStyle=C.ok; ctx.fillText(f.txt, f.x, f.y-f.t*30); }
  ctx.globalAlpha=1;
  ctx.restore();
}

function updateHud(){
  if(!$('#windVal')) return;
  const w = Math.abs(wind);
  $('#windVal').textContent = w<.3 ? 'calm' : (wind>0 ? '→ ' : '← ') + w.toFixed(1);
  const n = vaults.filter(v=>v.hit).length;
  $('#vaultVal').textContent = n + '/4';
  $('#shotVal').textContent = shots;
  const kl = $('#keyline'); kl.innerHTML = '';
  KEY_WORDS.forEach((word, i) => {
    const got = vaults.some(v => v.hit && v.word === i);
    const s = document.createElement('span');
    if(got){ s.className='got'; s.textContent = word; } else { s.textContent = '█'.repeat(word.length); }
    kl.appendChild(s);
    if(i < KEY_WORDS.length-1) kl.appendChild(document.createTextNode('-'));
  });
  kl.setAttribute('aria-label', `Launch key: ${n} of 4 shards recovered`);
}

function syncAim(){
  const a=+$('#ang').value, p=+$('#pow').value;
  $('#angV').textContent=a+'°'; $('#powV').textContent=p;
  if(player && phase!=='flight'){ player.angle=a; player.power=p; }
}

addEventListener('keydown', e => {
  if(phase!=='aim' || !$('#ang')) return;
  const tg = e.target.tagName;
  if(e.target === cmd) return;
  if(tg==='INPUT' && e.key!==' ') return;
  if(tg==='BUTTON' && (e.key===' '||e.key==='Enter')) return;
  const step = e.shiftKey ? 1 : 3;
  if(e.key==='ArrowLeft') $('#ang').value = +$('#ang').value+step;
  else if(e.key==='ArrowRight') $('#ang').value = +$('#ang').value-step;
  else if(e.key==='ArrowUp') $('#pow').value = +$('#pow').value+step;
  else if(e.key==='ArrowDown') $('#pow').value = +$('#pow').value-step;
  else if(e.key===' '){ e.preventDefault(); syncAim(); fire(); return; }
  else return;
  e.preventDefault(); syncAim();
});

function frame(ts){ const dt=Math.min(.05,(ts-last)/1000); last=ts; update(dt); render(); requestAnimationFrame(frame); }

/* ================= Contract address ================= */
(function(){
  const btn = $('#ca'), txt = $('#caText'), hint = $('#caHint');
  const ca = CONTRACT_ADDRESS.trim();
  if(!ca){
    btn.classList.add('empty'); btn.disabled = true;
    txt.textContent = 'coming soon'; hint.textContent = '';
    return;
  }
  const short = ca.length > 14 ? ca.slice(0,6) + '…' + ca.slice(-6) : ca;
  const fit = () => { txt.textContent = innerWidth < 720 ? short : ca; };
  fit(); addEventListener('resize', fit);
  btn.setAttribute('aria-label', 'Copy contract address ' + ca);
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(ca); }
    catch(e){
      const t = document.createElement('textarea'); t.value = ca; document.body.appendChild(t);
      t.select(); try{ document.execCommand('copy'); }catch(_){} t.remove();
    }
    btn.classList.add('done'); hint.textContent = 'copied';
    setTimeout(() => { btn.classList.remove('done'); hint.textContent = 'copy'; }, 1400);
  };
})();

readColors();
run();
</script>
